<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ESG 증류소 타이쿤 · 실시간 랭킹</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=DotGothic16&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --night:#161a33; --night-2:#1f2547; --panel:#252c55; --line:#3b4478;
  --cream:#f4ead2; --mute:#aeb3d6; --dim:#7e86b8;
  --amber:#f0a83a; --red:#ff6b6b; --gold:#ffd166; --e:#5fd38a; --s:#ff8f6b; --g:#a98bff;
  --display:'Do Hyeon','Noto Sans KR',sans-serif;
  --body:'Noto Sans KR',system-ui,sans-serif;
  --pix:'DotGothic16','Noto Sans KR',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--night);color:var(--cream);font-family:var(--body);font-size:15px;line-height:1.5;
  padding:max(16px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 28px max(14px,env(safe-area-inset-left,0px))}
button,input{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{text-align:center;padding:6px 0 2px}
.eyebrow{font-family:var(--pix);color:var(--amber);font-size:13px;letter-spacing:.08em;margin:0}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,7vw,52px);line-height:1.1;margin:6px 0 4px}
.live{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--e);box-shadow:0 0 0 0 rgba(95,211,138,.6);animation:pulse 2s infinite}
.dot.off{background:var(--red);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(95,211,138,.6)}70%{box-shadow:0 0 0 9px rgba(95,211,138,0)}100%{box-shadow:0 0 0 0 rgba(95,211,138,0)}}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tabs button{border:2px solid var(--line);background:var(--night-2);padding:8px 16px;cursor:pointer;font-family:var(--display);font-size:18px;min-height:44px}
.tabs button[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#1b1630}
.prize{background:linear-gradient(90deg,#3a2a14,#2a2140);border:2px solid var(--gold);padding:10px 14px;text-align:center;font-size:14px}
.prize b{color:var(--gold);font-family:var(--display);font-weight:400;font-size:19px}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end}
.pod{background:var(--panel);border:3px solid var(--line);padding:12px 8px 10px;text-align:center;min-width:0}
.pod .medal{font-size:28px;line-height:1}
.pod .nm{font-family:var(--display);font-size:clamp(18px,4.6vw,26px);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .no{font-size:12px;color:var(--dim)}
.pod .sc{font-family:var(--pix);font-size:clamp(17px,4.4vw,24px);margin-top:4px;font-variant-numeric:tabular-nums}
.pod.p1{border-color:var(--gold);padding-top:20px;box-shadow:0 0 18px rgba(255,209,102,.25)}
.pod.p1 .sc{color:var(--gold)}
.pod.empty{opacity:.35}
.list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--night-2);border:2px solid var(--line);padding:9px 12px}
.row .rk{font-family:var(--pix);font-size:20px;color:var(--mute);text-align:center}
.row .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm small{font-weight:400;color:var(--dim);margin-left:6px}
.row .bars{display:flex;gap:3px;margin-top:4px;height:6px}
.row .bars i{display:block;height:100%}
.row .sc{font-family:var(--pix);font-size:19px;font-variant-numeric:tabular-nums}
.pos{color:var(--e)} .neg{color:var(--red)}
.row.me{border-color:var(--gold);background:#2e2a3f}
.row.new{animation:flash 2.4s}
@keyframes flash{0%,40%{background:#4a3b16}100%{background:var(--night-2)}}
.find{display:flex;gap:8px}
.find input{flex:1;min-width:0;background:var(--night-2);border:2px solid var(--line);padding:10px 12px;min-height:46px}
.find input:focus-visible,.tabs button:focus-visible,.find button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.find button{border:0;background:var(--amber);color:#1b1630;font-family:var(--display);font-size:18px;padding:0 18px;cursor:pointer;min-height:46px}
.mine{min-height:22px;text-align:center;font-size:14px;color:var(--gold)}
.note{color:var(--dim);font-size:12.5px;text-align:center;margin:0}
.empty-msg{text-align:center;color:var(--mute);padding:28px 10px;border:2px dashed var(--line)}
.legend{display:flex;gap:12px;justify-content:center;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:6px;margin-right:4px;vertical-align:middle}
/* 부스 큰 화면(가로가 넓을 때) */
@media (min-width:1100px){ .wrap{max-width:980px} body{font-size:17px} .row .sc{font-size:23px} .row{padding:12px 16px} }
@media (prefers-reduced-motion:reduce){ .dot,.row.new{animation:none} }
</style>
<script src="config.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">삼송술집 · 자기주도진로설계 성과발표회</p>
    <h1>ESG 증류소 타이쿤<br>실시간 랭킹</h1>
    <span class="live" aria-live="polite"><span class="dot" id="dot"></span><span id="stamp">불러오는 중…</span></span>
  </header>

  <div class="tabs" id="tabs" role="group" aria-label="날짜 선택"></div>
  <div class="prize">오늘의 1등 CEO에게 <b>🍸 칵테일 교환권</b> · 참여자 전원 삼송술집 스티커</div>

  <section class="podium" id="podium" aria-label="1~3위"></section>
  <ol class="list" id="list" aria-label="4위 이하"></ol>

  <form class="find" id="find">
    <label for="q" class="sr" style="position:absolute;left:-9999px">참가번호</label>
    <input id="q" inputmode="numeric" placeholder="내 참가번호로 순위 찾기 (예: 012)" autocomplete="off">
    <button type="submit">찾기</button>
  </form>
  <div class="mine" id="mine" aria-live="polite"></div>

  <div class="legend"><span><i style="background:var(--e)"></i>E 환경</span><span><i style="background:var(--s)"></i>S 사회</span><span><i style="background:var(--g)"></i>G 지배구조</span></div>
  <p class="note">점수 = 같은 사건을 겪은 ESG 0원 회사보다 5년간 더 번 이익(억 원) · 참가번호당 그날 첫 판만 인정 · 10초마다 자동 갱신</p>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const todayKST = () => new Date(Date.now() + 9*3600e3).toISOString().slice(0,10);
  const WD = ['일','월','화','수','목','금','토'];
  const dayLabel = d => `${+d.slice(5,7)}/${+d.slice(8,10)}(${WD[new Date(d+'T12:00:00Z').getUTCDay()]})`;
  // 이름 가리기: 부혜민 → 부*민, 홍길 → 홍*
  const mask = n => { n = String(n||'').trim(); if(n.length<=1) return n; if(n.length===2) return n[0]+'*'; return n[0]+'*'.repeat(n.length-2)+n[n.length-1]; };
  const won = v => (v>0?'+':v<0?'−':'') + Math.abs(Math.round(v)).toLocaleString('ko-KR') + '억';
  const num = v => String(v).replace(/\D/g,'').replace(/^0+(?=\d)/,'');

  let all = [], day = null, seen = new Set(), first = true, myNum = '', lastOk = 0;

  function clean(rows){
    const ok = rows.filter(r => r && r.id && r.day).map(r => ({...r, score:+r.score||0, profit:+r.profit||0, E:+r.E||0, S:+r.S||0, G:+r.G||0, num:String(r.num)}));
    ok.sort((a,b) => String(a.at).localeCompare(String(b.at)));
    const keep = new Map();               // 같은 날 같은 참가번호는 첫 판만
    ok.forEach(r => { const k = r.day+'|'+num(r.num); if(!keep.has(k)) keep.set(k, r); });
    return [...keep.values()];
  }
  const board = d => all.filter(r => r.day===d).sort((a,b)=>b.score-a.score || b.profit-a.profit || String(a.at).localeCompare(String(b.at)));

  function tabs(){
    const days = [...new Set(all.map(r=>r.day).concat(todayKST()))].sort();
    if(!day || !days.includes(day)) day = days.includes(todayKST()) ? todayKST() : days[days.length-1];
    $('#tabs').innerHTML = days.map(d => `<button type="button" data-d="${d}" aria-pressed="${d===day}">${d===todayKST()?'오늘 · ':''}${dayLabel(d)}</button>`).join('');
    document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { day = b.dataset.d; draw(); });
  }
  const bars = r => { const t = r.E+r.S+r.G || 1; return `<span class="bars" aria-hidden="true"><i style="width:${r.E/t*100}%;background:var(--e)"></i><i style="width:${r.S/t*100}%;background:var(--s)"></i><i style="width:${r.G/t*100}%;background:var(--g)"></i></span>`; };

  function draw(){
    tabs();
    const list = board(day);
    const pod = [1,0,2].map(i => {
      const r = list[i], cls = 'pod p'+(i+1)+(r?'':' empty'), medal = ['🥇','🥈','🥉'][i];
      if(!r) return `<div class="${cls}"><div class="medal">${medal}</div><div class="nm">도전자 대기</div><div class="sc">—</div></div>`;
      return `<div class="${cls}"><div class="medal">${medal}</div><div class="nm">${esc(mask(r.name))}</div><div class="no">#${esc(r.num)}</div><div class="sc ${r.score<0?'neg':''}">${won(r.score)}</div></div>`;
    }).join('');
    $('#podium').innerHTML = pod;
    const rest = list.slice(3, 30);
    $('#list').innerHTML = list.length ? rest.map((r,i) => `<li class="row${num(r.num)===myNum?' me':''}${!first&&!seen.has(r.id)?' new':''}"><span class="rk">${i+4}</span><span><span class="nm">${esc(mask(r.name))}<small>#${esc(r.num)}</small></span>${bars(r)}</span><span class="sc ${r.score>=0?'pos':'neg'}">${won(r.score)}</span></li>`).join('')
      : `<li class="empty-msg">아직 기록이 없어요. 첫 번째 CEO가 되어 보세요!</li>`;
    if(list.length > 30) $('#list').insertAdjacentHTML('beforeend', `<li class="note">외 ${list.length-30}명 참여 중</li>`);
    findMine();
  }

  function findMine(){
    if(!myNum){ $('#mine').textContent=''; return; }
    const list = board(day), i = list.findIndex(r => num(r.num)===myNum);
    $('#mine').innerHTML = i<0 ? `${esc(dayLabel(day))}에 #${esc(myNum)} 기록이 아직 없어요. 등록까지 몇 초 걸릴 수 있어요.`
      : `#${esc(list[i].num)} ${esc(mask(list[i].name))} 님은 ${esc(dayLabel(day))} <b>${i+1}위</b> (${won(list[i].score)}) · 전체 ${list.length}명`;
  }
  $('#find').onsubmit = e => { e.preventDefault(); myNum = num($('#q').value); draw(); };

  async function load(){
    if(!window.RANK_API){ $('#stamp').textContent = '설정 필요: config.js에 RANK_API 주소를 넣어 주세요'; $('#dot').classList.add('off'); return; }
    try{
      const res = await fetch(window.RANK_API + (window.RANK_API.includes('?')?'&':'?') + 't=' + Date.now(), {cache:'no-store'});
      const j = await res.json();
      if(!j.ok) throw new Error(j.error||'error');
      all = clean(j.rows||[]); draw();
      all.forEach(r => seen.add(r.id)); first = false; lastOk = Date.now();
      $('#dot').classList.remove('off');
    }catch(e){
      $('#dot').classList.add('off');
      if(!lastOk) $('#stamp').textContent = '연결 중… 잠시 후 다시 시도해요';
    }
  }
  setInterval(() => {
    if(lastOk){ const s = Math.round((Date.now()-lastOk)/1000); $('#stamp').textContent = s<5 ? '방금 갱신됨' : `${s}초 전 갱신`; }
  }, 1000);
  load(); setInterval(load, 10000);
})();
</script>
</body>
</html>
