<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ESG 증류소 타이쿤</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=DotGothic16&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: arcade cabinet — pixel distillery scene + HUD on the left, the turn's panel on the right; stacks on phones. Single dark "night shift" look. */
:root{
  color-scheme: dark;
  --night:#161a33; --night-2:#1f2547; --panel:#252c55; --line:#3b4478;
  --cream:#f4ead2; --mute:#aeb3d6; --dim:#7e86b8;
  --amber:#f0a83a; --copper:#c8693a; --red:#ff6b6b; --gold:#ffd166;
  --e:#5fd38a; --s:#ff8f6b; --g:#a98bff;
  --display:'Do Hyeon','Noto Sans KR',sans-serif;
  --body:'Noto Sans KR',system-ui,sans-serif;
  --pix:'DotGothic16','Noto Sans KR',monospace;
}
html,body{height:100%}
body{background:var(--night);color:var(--cream);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
.app{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}}
.stage{display:flex;flex-direction:column;gap:12px;min-width:0}
.screen{position:relative;border:4px solid var(--line);background:#0e1126;box-shadow:0 0 0 4px #0b0d1f, 0 10px 0 4px #0b0d1f}
.screen canvas{display:block;width:100%;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s}
.hud{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hud .cell{background:var(--night-2);border:2px solid var(--line);padding:8px 10px;min-width:0}
.hud .k{font-size:12px;color:var(--mute);letter-spacing:.04em}
.hud .v{font-family:var(--pix);font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.meter{background:var(--night-2);border:2px solid var(--line);padding:8px 10px}
.meter .top{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:13px}
.meter .top b{font-family:var(--display);font-weight:400;font-size:18px}
.bar{height:12px;background:#11152e;border:2px solid #0b0d1f;margin-top:6px;position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;left:0}
.bar i.pend{opacity:.35}
.meter small{display:block;color:var(--dim);font-size:12px;margin-top:4px;font-variant-numeric:tabular-nums}

.panel{background:var(--panel);border:4px solid var(--line);box-shadow:0 8px 0 #0b0d1f;padding:22px;min-width:0;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:44px;color:var(--amber);letter-spacing:.01em}
h2{font-size:30px}
h3{font-size:21px}
p{margin:0}
.eyebrow{font-family:var(--pix);font-size:13px;color:var(--amber);letter-spacing:.12em}
.lead{color:var(--mute)}
.btn{appearance:none;border:0;cursor:pointer;font-family:var(--display);font-size:22px;padding:12px 20px;background:var(--amber);color:#2a1a05;box-shadow:inset -4px -4px 0 #b9761c, inset 4px 4px 0 #ffd38a;letter-spacing:.02em}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--night-2);color:var(--cream);box-shadow:inset -4px -4px 0 #11152e, inset 4px 4px 0 #3b4478}
.btn:focus-visible,.step:focus-visible,input:focus-visible,.link:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:6px;flex:1 1 160px;min-width:0}
.field label{font-size:13px;color:var(--mute)}
.field input[type=text]{background:#11152e;border:2px solid var(--line);padding:10px 12px;font-size:17px;width:100%}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mute)}
.check input{width:18px;height:18px;accent-color:var(--amber)}
.link{background:none;border:0;padding:0;color:var(--gold);text-decoration:underline;cursor:pointer;font-size:14px}

.alloc{display:flex;flex-direction:column;gap:12px}
.acard{border:2px solid var(--line);background:var(--night-2);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.acard .head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.acard .name{font-family:var(--display);font-size:21px}
.acard .amt{font-family:var(--pix);font-size:24px;font-variant-numeric:tabular-nums}
.acard .desc{font-size:13px;color:var(--mute)}
.ctrl{display:flex;gap:8px;align-items:center}
.step{width:44px;height:40px;border:0;background:#11152e;box-shadow:inset -3px -3px 0 #0b0d1f, inset 3px 3px 0 #3b4478;font-family:var(--pix);font-size:20px;cursor:pointer;flex:none}
.ctrl input[type=range]{flex:1;min-width:0;accent-color:var(--amber);height:28px}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border:2px solid currentColor;line-height:1.4;font-weight:700;letter-spacing:.03em;white-space:nowrap}
.tag.research{color:var(--gold)}
.tag.scenario{color:var(--dim)}
.sum{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--mute);border-top:2px dashed var(--line);padding-top:10px}
.sum b{color:var(--cream);font-family:var(--pix);font-weight:400;font-size:18px}

.card{border:4px solid var(--line);background:#141936;padding:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.card canvas{width:64px;height:64px;image-rendering:pixelated;background:#0e1126;border:2px solid var(--line)}
.card.neg{border-color:#7a3344}
.card.pos{border-color:#7a6a2a}
.card .t{font-family:var(--display);font-size:24px;line-height:1.2}
.card .d{font-size:14px;color:var(--mute)}
.ledger{display:flex;flex-direction:column;gap:0;border:2px solid var(--line)}
.ledger .li{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;border-top:2px solid var(--line);align-items:center}
.ledger .li:first-child{border-top:0}
.ledger .li .l{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0;font-size:14px}
.ledger .li .n{font-family:var(--pix);font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ledger .li.total{background:var(--night-2)}
.ledger .li.total .l{font-family:var(--display);font-size:19px}
.ledger .li.total .n{font-size:24px}
.plus{color:var(--e)} .minus{color:var(--red)}
.note{font-size:13px;color:var(--mute);background:#141936;border-left:4px solid var(--amber);padding:8px 12px}

.board{display:flex;flex-direction:column;border:2px solid var(--line)}
.board .br{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;padding:7px 12px;border-top:2px solid var(--line);align-items:center;font-size:15px}
.board .br:first-child{border-top:0}
.board .br .rk{font-family:var(--pix);color:var(--amber)}
.board .br .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .br .pf{font-family:var(--pix);font-variant-numeric:tabular-nums}
.board .br.me{background:#3a3418}
.board .empty{padding:14px;color:var(--mute);font-size:14px}
.boardnote{font-size:12px;color:var(--dim)}

.result-big{font-family:var(--pix);font-size:40px;line-height:1.1;font-variant-numeric:tabular-nums}
.vs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.vs .c{border:2px solid var(--line);background:var(--night-2);padding:10px 12px}
.vs .c .k{font-size:13px;color:var(--mute)}
.vs .c .v{font-family:var(--pix);font-size:22px;font-variant-numeric:tabular-nums}
.chartwrap canvas{width:100%;aspect-ratio:2/1;image-rendering:pixelated;background:#0e1126;border:2px solid var(--line);display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.twin{border:2px solid var(--gold);background:#2a2a3e;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.twin b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--gold)}

.basis{border-collapse:collapse;width:100%;font-size:13px}
.basis th,.basis td{border:2px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.basis th{background:var(--night-2);font-weight:700}
.tablewrap{overflow-x:auto}
.timeline{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
.timeline i{height:10px;background:#11152e;border:2px solid #0b0d1f}
.timeline i.done{background:var(--amber)}
.timeline i.now{background:var(--gold);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.4}}
@media (prefers-reduced-motion:reduce){.timeline i.now{animation:none}.flash{transition:none}}
/* ── 추가: 대결 모드 · 타이머 · 일자별 랭킹 ── */
.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.modes button{appearance:none;border:2px solid var(--line);background:var(--night-2);padding:12px 6px;cursor:pointer;font-family:var(--display);font-size:20px}
.modes button[aria-pressed="true"]{border-color:var(--amber);background:#3a2c14;color:var(--gold)}
.modes small{display:block;font-family:var(--body);font-size:12px;color:var(--mute)}
.prow-in{display:grid;grid-template-columns:28px minmax(0,1fr) 120px;gap:8px;align-items:end}
.prow-in .pn{font-family:var(--pix);color:var(--amber);font-size:20px;padding-bottom:8px}
.rules{margin:0;padding-left:18px;color:var(--mute);font-size:14px;display:flex;flex-direction:column;gap:4px}
.rules b{color:var(--cream)}
.timer{height:10px;background:#11152e;border:2px solid #0b0d1f;position:relative;overflow:hidden}
.timer i{position:absolute;inset:0 auto 0 0;background:var(--amber);width:100%}
.timer.low i{background:var(--red)}
.timerrow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
.timerrow b{font-family:var(--pix);color:var(--cream);font-weight:400;font-size:18px}
.turn{border:2px dashed var(--amber);padding:10px 12px;color:var(--gold);font-family:var(--display);font-size:20px}
.card.flip{animation:flip .55s ease-out}
@keyframes flip{from{transform:perspective(600px) rotateY(80deg);opacity:0}to{transform:none;opacity:1}}
.breaking{font-family:var(--pix);font-size:13px;letter-spacing:.12em;color:#fff;background:var(--red);padding:2px 8px;display:inline-block}
.prows{display:flex;flex-direction:column;border:2px solid var(--line)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 12px;border-top:2px solid var(--line);align-items:center}
.prow:first-child{border-top:0}
.prow .who{display:flex;gap:8px;align-items:baseline;min-width:0}
.prow .who .rk{font-family:var(--pix);color:var(--amber);font-size:18px}
.prow .who .nm{font-family:var(--display);font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .num{font-family:var(--pix);font-size:20px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.prow .why{grid-column:1 / -1;font-size:13px;color:var(--mute)}
.prow .race{grid-column:1 / -1;height:10px;background:#11152e;position:relative}
.prow .race i{position:absolute;top:0;bottom:0}
.prow .move{font-size:12px;font-family:var(--pix)}
.prow.lead{background:#2e2a17}
.toggle{display:flex;gap:6px}
.toggle button{appearance:none;border:2px solid var(--line);background:#11152e;padding:8px 10px;cursor:pointer;font-size:14px;font-weight:700}
.toggle button[aria-pressed="true"]{border-color:var(--gold);background:#3a2c14;color:var(--gold)}
.tu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;grid-column:1 / -1}
.tu .c{display:flex;align-items:center;justify-content:space-between;gap:4px;background:#11152e;padding:4px 6px}
.tu .c b{font-family:var(--pix);font-weight:400}
.tu .step{width:34px;height:32px;font-size:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{appearance:none;border:2px solid var(--line);background:var(--night-2);padding:6px 12px;cursor:pointer;font-size:14px;font-weight:700}
.tabs button[aria-pressed="true"]{border-color:var(--amber);color:var(--gold)}
.board .br{grid-template-columns:36px minmax(0,1fr) auto auto}
.board .br .sub{font-size:12px;color:var(--dim);font-family:var(--body)}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:12px;padding:2px 8px;border:2px solid var(--gold);color:var(--gold);font-weight:700}
.prize{border:2px solid var(--gold);background:#2a2a3e;padding:10px 12px;font-size:14px}
.prize b{color:var(--gold)}
.admin{border:2px dashed var(--red);padding:12px;display:flex;flex-direction:column;gap:10px}
.admin .br button{font-size:12px}
.small-btn{appearance:none;border:2px solid var(--line);background:#11152e;padding:6px 10px;cursor:pointer;font-size:13px;font-weight:700}
.big-score{font-family:var(--pix);font-size:44px;line-height:1.1;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.card.flip{animation:none}}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="app">
  <section class="stage" aria-label="회사 현황">
    <div class="screen">
      <canvas id="scene" width="192" height="108" aria-label="밤의 증류소. 나무는 E, 사람은 S, 본사 건물 불빛은 G 투자 효과를 나타냅니다."></canvas>
      <div class="flash" id="flash"></div>
    </div>
    <div class="timeline" id="timeline" aria-hidden="true"></div>

    <div class="meters" id="meters"></div>
  </section>

  <main class="panel" id="panel" aria-live="polite"></main>
</div>

];

// ───────── 게임 수치 (원작 수치 유지 · 위기 대응만 추가) ─────────
const BASE = 300;          // 반기 기본 순이익(억) = 자산 1조 × 연 ROA 6% ÷ 2 (27개사 ROA 중앙값)
const LAG = 2;             // 효과 발동까지 반기 수(1년)
const K = 30;              // 수확 체감 상수(억)
const DEF = 0.4;           // 최대 방어율 40%
const POS_BASE = 0.55;     // 투자가 없어도 받는 긍정 이벤트 몫
const FRIC = 0.4;          // S·G 전환 비용(투자액의 40%, 1년에 걸쳐)
const BUDGET = 100;
const CRISIS = -150;       // 이 이하 악재는 '긴급 대응' 선택 발생
const C_COST = 45;         // 긴급 대응 비용(억)
const C_CUT = 0.3;         // 긴급 대응 시 남은 피해 추가 감소율
const T_ALLOC = 30, T_CRISIS = 30, T_TOPUP = 20; // 제한 시간(초)
const AREAS = ['E','S','G'];
const AREA = {
  E:{name:'환경 E', color:'#5fd38a', desc:'탄소세·가뭄·폐수 사고를 막고, 친환경 이슈 때 수혜'},
  S:{name:'사회 S', color:'#ff8f6b', desc:'광고 논란·불매운동·안전사고·공급망 리스크를 막고, 책임음주·상생 이슈 때 수혜'},
  G:{name:'지배구조 G', color:'#a98bff', desc:'회계 부정·오너 리스크·소송을 막고, ESG 펀드 편입·투자 유치 때 수혜'}
};
const PCOL = ['#f0a83a','#5bb4ff','#ff8f6b','#a98bff'];

// ───────── 유틸 ─────────
const $ = s => document.querySelector(s);
const panel = $('#panel');
const fmt = n => { const r = Math.round(n); return (r<0?'−':'') + Math.abs(r).toLocaleString('ko-KR') + '억'; };
const sfmt = n => { const r = Math.round(n); return (r>0?'+':r<0?'−':'±') + Math.abs(r).toLocaleString('ko-KR') + '억'; };
const halfLabel = h => `${2027+Math.floor(h/2)} ${h%2===0?'상반기':'하반기'}`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const score = amt => 1 - Math.exp(-amt/K);
const todayKST = () => new Date(Date.now() + 9*3600e3).toISOString().slice(0,10);
const dayLabel = d => `${+d.slice(5,7)}/${+d.slice(8,10)}`;
function effAt(list, a, h){ return list.filter(x=>x.a===a && h >= x.h+LAG).reduce((t,x)=>t+x.amt,0); }
function pendAt(list, a, h){ return list.filter(x=>x.a===a && h < x.h+LAG).reduce((t,x)=>t+x.amt,0); }
const sumArea = (p,a) => p.inv.filter(x=>x.a===a).reduce((t,x)=>t+x.amt,0);
const invested = p => p.inv.reduce((t,x)=>t+x.amt,0);
const left = p => BUDGET - invested(p);

function settle(list, h, ev, respond){
  const cost = list.filter(x=>x.h===h).reduce((t,x)=>t+x.amt,0);
  const fric = list.filter(x=>(x.a==='S'||x.a==='G') && (x.h===h || x.h===h-1)).reduce((t,x)=>t+x.amt*FRIC/2,0);
  const sc = score(effAt(list, ev.a, h));
  let impact = ev.v<0 ? ev.v*(1-DEF*sc) : ev.v*(POS_BASE+(1-POS_BASE)*sc);
  const raw = ev.v<0 ? ev.v : ev.v*POS_BASE;
  let cc = 0;
  if(ev.v<=CRISIS && respond){ impact *= (1-C_CUT); cc = C_COST; }
  return {cost, fric, sc, impact, raw, cc, net: BASE - cost - fric + impact - cc};
}
const BAL_PLAN = [{h:0,a:'E',amt:33},{h:0,a:'S',amt:33},{h:0,a:'G',amt:34}];

const fresh = () => ({phase:'title', count:1, practice:false, names:['','','',''], nums:['','','',''],
  players:[], ap:0, deck:[], h:0, zero:0, zeroSeries:[], bal:0, balSeries:[], fast:false, paused:false});

const focusPlayer = () => {
  if(!G.players.length) return null;
  if(G.phase==='alloc') return G.players[G.ap];
  return ranked()[0];
};
const excess = p => p.cum - G.zero;
const ranked = () => [...G.players].sort((a,b)=>excess(b)-excess(a));

// 장면 연결 (원작 장면 코드가 쓰는 함수들)
function sceneHalf(){ return (G.phase==='alloc'||G.phase==='title'||G.phase==='setup') ? 0 : Math.min(G.h, 9); }
function curList(){
  const p = focusPlayer(); if(!p) return [];
  if(G.phase==='alloc') return AREAS.filter(a=>p.alloc[a]>0).map(a=>({h:0,a,amt:p.alloc[a]}));
  return p.inv;
}

// ───────── 소리 (짧은 효과음, 끌 수 있음) ─────────
let soundOn = true, actx = null;
function beep(kind){
  if(!soundOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const seq = {flip:[[520,.06]], good:[[660,.08],[880,.12]], bad:[[220,.12],[160,.18]], tick:[[900,.03]], win:[[523,.1],[659,.1],[784,.1],[1046,.25]]}[kind] || [];
    let t = actx.currentTime;
    seq.forEach(([f,d])=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type='square'; o.frequency.value=f; g.gain.value=.05; o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t+=d; });
  }catch(e){}
}

// ───────── 타이머 ─────────
let timerId = null, autoId = null;
function clearTimers(){ clearInterval(timerId); timerId=null; clearInterval(autoId); autoId=null; }
function startTimer(sec, onEnd){
  const end = Date.now() + sec*1000;
  const tick = () => {
    const rem = Math.max(0, end - Date.now());
    const bar = $('#tbar'), num = $('#tnum');
    if(bar){ bar.style.width = (rem/(sec*1000)*100)+'%'; bar.parentElement.classList.toggle('low', rem<4000); }
    if(num) num.textContent = Math.ceil(rem/1000)+'초';
    if(rem<=0){ clearTimers(); onEnd(); }
  };
  clearInterval(timerId); timerId = setInterval(tick, 100); tick();
}
const timerHTML = label => `<div class="timerrow"><span>${label}</span><b id="tnum"></b></div><div class="timer"><i id="tbar"></i></div>`;
function startAuto(sec, onEnd){
  if(G.paused) return;
  const end = Date.now() + sec*1000;
  clearInterval(autoId); const n0=$('#anum'); if(n0) n0.textContent = Math.ceil(sec);
  autoId = setInterval(()=>{ const rem = end-Date.now(); const n=$('#anum'); if(n) n.textContent = Math.ceil(Math.max(0,rem)/1000);
    if(rem<=0){ clearInterval(autoId); autoId=null; onEnd(); } }, 150);
}

// ───────── 랭킹 저장소 (이 기기 · 일자별) ─────────
const LS = 'esg-tycoon-scores-v2';
function rows(){ try{ return JSON.parse(localStorage.getItem(LS)||'[]'); }catch(e){ return []; } }
function writeRows(a){ try{ localStorage.setItem(LS, JSON.stringify(a)); return true; }catch(e){ return false; } }
function days(){ const s = new Set(rows().map(r=>r.day)); s.add(todayKST()); return [...s].sort().reverse(); }
function dayBoard(day){ return rows().filter(r=>!day || r.day===day).sort((a,b)=>b.score-a.score || b.profit-a.profit || a.at.localeCompare(b.at)); }
function savePlayer(p){
  if(G.practice || p.saved) return;
  if(!p.num){ p.saved = {note:'참가번호가 없어 연습 기록으로 처리했어요.'}; return; }
  const day = todayKST(), all = rows();
  if(all.some(r=>r.day===day && r.num===p.num)){ p.saved = {note:`참가번호 #${p.num}은 오늘 이미 랭킹에 있어요. 첫 판 기록만 인정돼요.`}; return; }
  const rec = {id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), day, name:p.name, num:p.num,
    score:Math.round(excess(p)), profit:Math.round(p.cum), E:sumArea(p,'E'), S:sumArea(p,'S'), G:sumArea(p,'G'), players:G.players.length, at:new Date().toISOString()};
  all.push(rec);
  if(!writeRows(all)){ p.saved = {note:'저장 공간 문제로 기록하지 못했어요. 운영진에게 알려 주세요.'}; return; }
  const rank = dayBoard(day).findIndex(r=>r.id===rec.id) + 1;
  p.saved = {id:rec.id, rank, note:`오늘(${dayLabel(day)}) 랭킹 ${rank}위로 등록!`};
}
function boardHTML(day, top){
  const list = dayBoard(day).slice(0, top||10);
  const mine = new Set(G.players.map(p=>p.saved&&p.saved.id).filter(Boolean));
  if(!list.length) return `<div class="board"><div class="empty">${day?dayLabel(day)+'에는 ':''}아직 기록이 없어요. 첫 CEO가 되어 보세요!</div></div>`;
  return `<div class="board">${list.map((r,i)=>`<div class="br${mine.has(r.id)?' me':''}"><span class="rk">${i+1}</span>
    <span class="nm">${esc(r.name)} <span style="color:var(--dim)">#${esc(r.num)}</span>${day?'':` <span class="sub">${dayLabel(r.day)}</span>`}</span>
    <span class="pf ${r.score<0?'minus':'plus'}">${sfmt(r.score)}</span><span class="sub">${fmt(r.profit)}</span></div>`).join('')}</div>`;
}
function boardBlock(){
  const ds = days(); if(boardDay===null) boardDay = todayKST();
  return `<div class="tabs" role="group" aria-label="랭킹 날짜">${ds.map(d=>`<button data-day="${d}" aria-pressed="${boardDay===d}">${d===todayKST()?'오늘 · ':''}${dayLabel(d)}</button>`).join('')}<button data-day="" aria-pressed="${boardDay===''}">전체</button></div>
    <div id="boardBox">${boardHTML(boardDay)}</div>
    <p class="boardnote">점수 = 5년 누적 순이익 − 같은 사건을 겪은 ESG 0원 회사의 누적 순이익. 오른쪽 작은 숫자는 누적 순이익. 이 기기에 저장돼요.</p>`;
}
function wireBoard(){
  document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{ boardDay=b.dataset.day; document.querySelectorAll('[data-day]').forEach(x=>x.setAttribute('aria-pressed', x.dataset.day===boardDay)); $('#boardBox').innerHTML = boardHTML(boardDay); });

// ───────── HUD ─────────
function renderHud(){
  const pre = ['title','setup','alloc'].includes(G.phase);
  $('#hudTime').textContent = pre ? '2027 상반기' : G.phase==='result' ? '2031 결산' : halfLabel(G.h);
  const fp = focusPlayer();
  if(G.phase==='alloc' && fp){ $('#hudLeadK').textContent='투자 중인 CEO'; $('#hudLead').textContent = fp.name; }
  else if(fp && !pre){ $('#hudLeadK').textContent = G.players.length>1?'선두':'ESG 0원 회사 대비'; $('#hudLead').textContent = G.players.length>1 ? `${fp.name} ${sfmt(excess(fp))}` : sfmt(excess(fp)); }
  else { $('#hudLeadK').textContent='선두'; $('#hudLead').textContent='–'; }
  $('#hudBudgetK').textContent = fp ? `${fp.name}의 남은 예산` : '남은 ESG 예산';
  $('#hudBudget').textContent = fp ? fmt(G.phase==='alloc' ? BUDGET-(fp.alloc.E+fp.alloc.S+fp.alloc.G) : left(fp)) : '100억';
  const tl = $('#timeline'); tl.innerHTML='';
  const done = G.players.length ? G.players[0].rows.length : 0;
  for(let i=0;i<10;i++){ const b=document.createElement('i');
    if(G.phase==='result' || i < done) b.className='done';
    else if(!pre && i===G.h) b.className='now';
    tl.appendChild(b); }
  const m = $('#meters'); m.innerHTML='';
  const list = curList(), hh = sceneHalf();
  AREAS.forEach(a=>{
    const eff = effAt(list,a,hh), pend = pendAt(list,a,hh);
    const se = score(eff)*DEF*100, sp = score(eff+pend)*DEF*100;
    const d = document.createElement('div'); d.className='meter';
    d.innerHTML = `<div class="top"><b style="color:${AREA[a].color}">${a}</b><span>방어력 ${Math.round(se)}%</span></div>
      <div class="bar" role="img" aria-label="${AREA[a].name} 방어력 ${Math.round(se)}%, 대기 중 포함 ${Math.round(sp)}%"><i class="pend" style="width:${sp/DEF}%;background:${AREA[a].color}"></i><i style="width:${se/DEF}%;background:${AREA[a].color}"></i></div>
      <small>투자 ${eff+pend}억${pend?` · ${pend}억 효과 대기`:''}</small>`;
    m.appendChild(d);
  });
}

    G.players = [...Array(G.count).keys()].map(i=>newPlayer(G.names[i], G.nums[i], i));
    G.ap = 0; G.phase='alloc'; render();
  };
  $('#nm0') && $('#nm0').focus();
}

function stepper(obj, cap, onChange){
  const wrap = document.createElement('div'); wrap.className='alloc';
  AREAS.forEach(a=>{
    const c = document.createElement('div'); c.className='acard';
    c.innerHTML = `<div class="head"><span class="name" style="color:${AREA[a].color}">${AREA[a].name}</span><span class="amt">${obj[a]}억</span></div>
      <p class="desc">${AREA[a].desc}${a!=='E'?' <span class="tag research">첫 1년 전환 비용 40%</span>':''}</p>
      <div class="ctrl"><button class="step" data-d="-5" aria-label="${AREA[a].name} 5억 줄이기">−</button>
      <input type="range" min="0" max="${cap}" step="5" value="${obj[a]}" aria-label="${AREA[a].name} 투자액">
      <button class="step" data-d="5" aria-label="${AREA[a].name} 5억 늘리기">+</button></div>`;
    const set = v => {
      const others = AREAS.filter(b=>b!==a).reduce((t,b)=>t+obj[b],0);
      obj[a] = Math.max(0, Math.min(v, cap - others));
      c.querySelector('input').value = obj[a]; c.querySelector('.amt').textContent = obj[a]+'억'; onChange();
    };
    c.querySelector('input').addEventListener('input', e=>set(+e.target.value));
    c.querySelectorAll('.step').forEach(b=>b.onclick=()=>set(obj[a]+(+b.dataset.d)));
    wrap.appendChild(c);
  });
  return wrap;
}

function alloc(){
  const p = G.players[G.ap], multi = G.players.length>1;
  panel.innerHTML = `<p class="eyebrow">2027 상반기 · 첫 투자${multi?` · ${G.ap+1} / ${G.players.length}`:''}</p>

    <div id="st"></div><div class="sum" id="sum"></div>
    <div class="row"><button class="btn" id="go">투자 확정</button><button class="link" id="zero">이번엔 아끼기 (0원)</button></div>`;
  const upd = () => {
    const t = p.alloc.E+p.alloc.S+p.alloc.G, fr = (p.alloc.S+p.alloc.G)*FRIC;

    if(G.ap < G.players.length-1){ G.ap++; render(); } else startGame();
  };
  $('#go').onclick = done;
  $('#zero').onclick = () => { p.alloc={E:0,S:0,G:0}; done(); };
  startTimer(T_ALLOC, done);
}

function startGame(){
  const deck = [...EVENTS.keys()]; for(let i=deck.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [deck[i],deck[j]]=[deck[j],deck[i]]; }
  G.deck = deck.slice(0,10); G.h = 0; G.zero = 0; G.zeroSeries = []; G.bal = 0; G.balSeries = [];
  G.players.forEach((p,i)=>{ p.cum=0; p.series=[]; p.rows=[]; p.crisisLog=[]; p.prevRank=i; });
  G.phase = 'flip'; render();
}

function eventCard(ev, animate){
  const card = document.createElement('div'); card.className = 'card ' + (ev.v<0?'neg':'pos') + (animate?' flip':'');
  card.appendChild(iconCanvas(ev.i));

    <div class="t">${ev.t}</div><p class="d">${ev.d}</p>`;
  card.appendChild(body); return card;
}

function flip(){
  const h = G.h, ev = EVENTS[G.deck[h]];
  panel.innerHTML = `<p class="eyebrow">${halfLabel(h)} · ${h+1} / 10</p><h2>이번 반기 사건은…</h2>`;
  panel.appendChild(eventCard(ev, true));
  beep(ev.v<0?'bad':'good');

  const go = () => { if(ev.v<=CRISIS){ G.players.forEach(p=>p.respond=false); G.phase='crisis'; } else { resolveHalf(); G.phase='half'; } render(); };
  setTimeout(go, G.fast ? 900 : 1500);
}

      <p class="why">버티기 예상 ${sfmt(est(false))} · 대응 예상 ${sfmt(est(true))} (대응 비용 포함)</p>`;

function resolveHalf(){
  const h = G.h, ev = EVENTS[G.deck[h]];
  const before = ranked().map(p=>p.i);
  G.players.forEach(p=>{
    const r = settle(p.inv, h, ev, ev.v<=CRISIS && p.respond);
    p.rows[h] = r; p.cum += r.net; p.series.push(p.cum);
    if(ev.v<=CRISIS) p.crisisLog.push({respond:p.respond, smart: p.respond === (settle(p.inv,h,ev,true).net > settle(p.inv,h,ev,false).net)});
  });
  const z = settle([], h, ev, false), b = settle(BAL_PLAN, h, ev, false);
  G.zero += z.net; G.zeroSeries.push(G.zero); G.bal += b.net; G.balSeries.push(G.bal);
  G.players.forEach(p=>{ p.prevRank = before.indexOf(p.i); });
}

function half(){

    let why = ev.v<0 ? (r.sc>0 ? `${ev.a} 방어력 ${pct}% · 피해 ${fmt(r.impact-r.raw)} 줄임` : `${zeroWhy} · 피해 그대로`) : (r.sc>0 ? `${ev.a} 투자로 호재 ${sfmt(r.impact-r.raw)} 추가` : `${zeroWhy} · 기본 효과만`);
    if(r.cc) why += ` · 긴급 대응 −${C_COST}억`;
    if(r.cost) why += ` · ESG 집행 ${sfmt(-r.cost)}`;
    if(r.fric) why += ` · S·G 전환 비용 ${sfmt(-r.fric)}`;
    const mv = p.prevRank - k;
    const ex = excess(p), w = Math.abs(ex)/mx*50;
    const d = document.createElement('div'); d.className = 'prow' + (multi && k===0 ? ' lead' : '');
    d.innerHTML = `<div class="who">${multi?`<span class="rk">${k+1}</span>`:''}<span class="nm" style="color:${PCOL[p.i]}">${esc(p.name)}</span>${multi&&mv>0?`<span class="move plus">▲${mv}</span>`:multi&&mv<0?`<span class="move minus">▼${-mv}</span>`:''}</div>
      <div class="num"><span class="${r.net<0?'minus':'plus'}">${sfmt(r.net)}</span> <span style="color:var(--mute);font-size:14px">점수</span> <span class="${ex<0?'minus':'plus'}">${sfmt(ex)}</span></div>
      <div class="race" role="img" aria-label="ESG 0원 회사 대비 ${sfmt(ex)}"><i style="left:${ex<0?50-w:50}%;width:${w}%;background:${ex<0?'var(--red)':PCOL[p.i]}"></i><i style="left:50%;width:2px;background:var(--dim)"></i></div>
      <p class="why">${why}</p>`;
    wrap.appendChild(d);
  });
  panel.appendChild(wrap);
  const top = list[0];

  const tip = document.createElement('p'); tip.className='note';
  tip.innerHTML = h<2 ? '아직 투자 효과가 나타나기 전이에요. 전환 비용 때문에 ESG 0원 회사보다 뒤처질 수 있어요. 버텨 보세요!'
    : (multi && list[0].prevRank!==0 ? `<b>${esc(top.name)}</b> 대표가 선두로 올라섰어요!` : `점수는 같은 사건을 겪은 ESG 0원 회사보다 얼마나 더 벌었는지예요.`);
  panel.appendChild(tip);
  const row = document.createElement('div'); row.className='row';
  row.innerHTML = `<button class="btn" id="go">${lastH?'5년 결산 보기':needTop?`${2027+Math.floor(h/2)}년 연말 이사회`:'다음 반기'} <span style="font-size:15px">(<span id="anum"></span>)</span></button>
    <button class="btn ghost" id="pause">${G.paused?'자동 진행 켜기':'잠깐 멈춤'}</button>
    <label class="check"><input type="checkbox" id="fast" ${G.fast?'checked':''}> 빠르게</label>`;
  panel.appendChild(row);

    if(needTop){ G.players.forEach(p=>p.top={E:0,S:0,G:0}); G.phase='topup'; render(); return; }
    G.h++; G.phase='flip'; render();
  };
  $('#go').onclick = next;
  $('#pause').onclick = () => { G.paused = !G.paused; render(); };
  $('#fast').onchange = e => { G.fast = e.target.checked; };
  if(G.paused) $('#anum').textContent = '멈춤'; else startAuto(G.fast ? 2.5 : (multi ? 5 : 4), next);
}

function topup(){
  const h = G.h, nextH = h+1, effH = nextH + LAG;
  panel.innerHTML = `<p class="eyebrow">${2027+Math.floor(h/2)}년 연말 이사회</p><h2>ESG 투자를 늘릴까요?</h2>
    <p class="lead">지금 투자하면 ${halfLabel(nextH)}에 집행되고, 효과는 ${effH<=9?`<b>${halfLabel(effH)}</b>부터`:'<b>게임이 끝난 뒤</b>에야'} 나타나요. S·G는 전환 비용 40%가 다시 붙어요.</p>
    ${timerHTML('시간이 끝나면 지금 입력대로 확정')}
    <div class="prows" id="tp"></div>
    <div class="row"><button class="btn" id="go">확정</button></div>`;
  const tp = $('#tp');
  G.players.forEach(p=>{
    const d = document.createElement('div'); d.className='prow';
    const draw = () => {
      const t = p.top.E+p.top.S+p.top.G, rem = left(p)-t;
      d.innerHTML = `<div class="who"><span class="nm" style="color:${PCOL[p.i]}">${esc(p.name)}</span></div><div class="num" style="font-size:16px">남은 예산 ${rem}억</div>
        ${left(p)>0?`<div class="tu">${AREAS.map(a=>`<div class="c"><button class="step" data-a="${a}" data-d="-5" aria-label="${esc(p.name)} ${AREA[a].name} 5억 줄이기">−</button><b style="color:${AREA[a].color}">${a} ${p.top[a]}</b><button class="step" data-a="${a}" data-d="5" aria-label="${esc(p.name)} ${AREA[a].name} 5억 늘리기">+</button></div>`).join('')}</div>`:'<p class="why">예산을 모두 썼어요.</p>'}`;
      d.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
        const a=b.dataset.a, dd=+b.dataset.d, t=p.top.E+p.top.S+p.top.G;
        const room = left(p)-t, step = dd>0 ? Math.min(dd, room) : dd; if(step===0) return;
        const nv = Math.max(0, p.top[a]+step);

      });
    };
    draw(); tp.appendChild(d);
  });
  const done = () => { G.players.forEach(p=>AREAS.forEach(a=>{ if(p.top[a]>0) p.inv.push({h:nextH,a,amt:p.top[a]}); })); G.h++; G.phase='flip'; render(); };
  $('#go').onclick = done;
  startTimer(T_TOPUP, done);
}

function twin(p){
  const sc = a => { const [lo,hi]=RANGE[a]; return lo + (hi-lo)*score(sumArea(p,a)); };
  const me = {E:sc('E'),S:sc('S'),G:sc('G')};
  let best=null, bd=1e9;
  COMPANIES.forEach(c=>{ const d=(c[1]-me.E)**2+(c[2]-me.S)**2+(c[3]-me.G)**2; if(d<bd){bd=d;best=c;} });
  return best;
}
function badges(p){
  const b = [], ex = p.series.map((v,i)=>v-G.zeroSeries[i]);
  if(ex.some(v=>v<0) && ex[9]>0) b.push('역전의 CEO');
  if(p.crisisLog.length && p.crisisLog.every(c=>c.smart)) b.push('위기관리의 달인');
  if(AREAS.every(a=>sumArea(p,a)>=20)) b.push('균형 경영');
  if(AREAS.some(a=>sumArea(p,a)>=80)) b.push('한 우물 올인');
  if(invested(p)===0) b.push('ESG 무관심');
  else if(p.inv.every(x=>x.h===0) && ex[9]>0) b.push('뚝심 장기투자');
  return b.slice(0,3);
}

      <div class="num ${excess(p)<0?'minus':'plus'}">${sfmt(excess(p))}</div>
      <p class="why">E ${sumArea(p,'E')} · S ${sumArea(p,'S')} · G ${sumArea(p,'G')}억 · 누적 ${fmt(p.cum)} · ${story(p)}</p>
      ${badges(p).length?`<div class="badges" style="grid-column:1 / -1">${badges(p).map(x=>`<span class="badge">${x}</span>`).join('')}</div>`:''}
      <p class="why" style="color:var(--gold)">${G.practice?'연습 판이라 랭킹에 올리지 않았어요.':esc(p.saved?p.saved.note:'')}</p>
    </div>`).join('')}</div>

function drawChart(list){
  const c = $('#chart'); if(!c) return; const g = c.getContext('2d');
  const W=240,H=120,L=8,R=8,T=8,B=10;
  g.fillStyle='#0e1126'; g.fillRect(0,0,W,H);
  const ex = p => p.series.map((v,i)=>v-G.zeroSeries[i]);
  const all=[0,...list.flatMap(ex)]; const mn=Math.min(...all), mx=Math.max(...all);
  const y = v => Math.round(T + (H-T-B) * (1-(v-mn)/((mx-mn)||1)));
  const x = i => Math.round(L + (W-L-R) * i/10);
  g.fillStyle='#1f2547'; for(let i=0;i<=10;i+=2) g.fillRect(x(i),T,1,H-T-B);
  const line = (arr,col,w) => { g.fillStyle=col; let px0=x(0), py0=y(0);
    arr.forEach((v,i)=>{ const nx=x(i+1), ny=y(v); g.fillRect(px0,py0,nx-px0+w,w); const top=Math.min(py0,ny); g.fillRect(nx,top,w,Math.abs(ny-py0)+w); px0=nx; py0=ny; }); };
  g.fillStyle='#7e86b8'; g.fillRect(L,y(0),W-L-R,1);
  list.slice().reverse().forEach(p=>line(ex(p),PCOL[p.i],2));
}

function basisHTML(){
  return `<div class="tablewrap"><table class="basis">
  <tr><th>게임 규칙</th><th>근거</th></tr>
  <tr><td>기본 순이익 반기 300억 (자산 1조 × 연 6%)</td><td><span class="tag research">우리 연구</span> 글로벌 주류 27개사 ROA 중앙값 6.0%</td></tr>
  <tr><td>S·G 투자는 첫 1년 동안 투자액의 40%가 전환 비용으로 추가 발생</td><td><span class="tag research">우리 연구</span> S(r = −0.47)·G(r = −0.43) 점수가 높을수록 ROA가 낮았음. 방향만 반영하고 크기는 게임용으로 조정</td></tr>
  <tr><td>E 투자는 전환 비용 없음</td><td><span class="tag research">우리 연구</span> E와 ROA는 뚜렷한 관계 없음 (p = 0.31)</td></tr>
  <tr><td>투자 효과는 1년 뒤부터 발동</td><td><span class="tag research">선행연구</span> 조인영(2023) 교차지연 패널: 전기 지배구조 점수가 당기 ROA에 영향</td></tr>
  <tr><td>많이 넣을수록 효과 증가폭은 줄어듦, 오래 버틸수록 반등</td><td><span class="tag research">선행연구</span> Nollet, Filis &amp; Mitrokostas(2016): ESG가 일정 수준을 넘어야 성과가 개선되는 U자형 관계</td></tr>
  <tr><td>사회(S) 사건이 가장 많이 등장</td><td><span class="tag research">우리 연구</span> 머신러닝 변수 중요도 S &gt; G &gt; E</td></tr>
  <tr><td>점수 = ESG 0원 회사 대비 초과 이익</td><td><span class="tag scenario">게임 설계</span> 같은 사건 카드를 겪은 회사끼리 비교해 운의 영향을 줄임</td></tr>
  <tr><td>긴급 대응(−${C_COST}억, 피해 30% 추가 감소)</td><td><span class="tag scenario">게임 설계</span> 평소 방어력이 있으면 버티는 쪽이 유리하도록 조정 (시뮬레이션 2만 회)</td></tr>
  <tr><td>개별 사건과 금액</td><td><span class="tag scenario">가상 시나리오</span> 실제 기업 사례가 아니며, 균형이 맞도록 시뮬레이션으로 정함</td></tr>
  </table></div>`;
}

// ───────── 운영자 메뉴 (제목 위 작은 글씨를 5번 누르면 열림) ─────────
function renderAdmin(){
  const box = $('#adminBox'); if(!box) return;
  if(!adminOpen){ box.innerHTML=''; return; }
  const ds = days();
  box.innerHTML = `<div class="admin"><h3>운영자 메뉴</h3>
    <p class="boardnote">일자별 전체 기록을 확인하고 내보내거나, 잘못 들어간 기록을 지울 수 있어요. 상품 지급은 참가번호로 확인하세요.</p>
    <div class="row"><button class="small-btn" id="exp">CSV 내보내기</button><label class="small-btn" for="imp" style="cursor:pointer">CSV 가져오기(다른 기기 기록 합치기)</label><input type="file" id="imp" accept=".csv,text/csv" hidden><button class="small-btn" id="wipe">전체 기록 삭제</button></div>
    ${ds.map(d=>`<h3>${dayLabel(d)} 전체 순위</h3><div class="board">${dayBoard(d).map((r,i)=>`<div class="br"><span class="rk">${i+1}</span><span class="nm">${esc(r.name)} #${esc(r.num)}</span><span class="pf">${sfmt(r.score)}</span><button class="small-btn" data-del="${r.id}">삭제</button></div>`).join('') || '<div class="empty">기록 없음</div>'}</div>`).join('')}
  </div>`;
  $('#exp').onclick = () => {
    const head = ['날짜','순위','닉네임','참가번호','점수(억)','누적순이익(억)','E','S','G','인원','시각'];
    const lines = [head.join(',')];
    days().forEach(d=>dayBoard(d).forEach((r,i)=>lines.push([r.day,i+1,`"${r.name.replace(/"/g,'""')}"`,r.num,r.score,r.profit,r.E,r.S,r.G,r.players,r.at].join(','))));
    const blob = new Blob(['﻿'+lines.join('\n')], {type:'text/csv'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `ESG타이쿤_랭킹_${todayKST()}.csv`; a.click();
  };
  $('#imp').onchange = async e => {
    const f = e.target.files[0]; if(!f) return;
    const txt = (await f.text()).replace(/^﻿/,'').trim().split('\n').slice(1);
    const all = rows(); let added = 0;
    txt.forEach(line=>{
      const m = line.match(/^([^,]+),[^,]*,("(?:[^"]|"")*"|[^,]*),([^,]*),([^,]*),([^,]*),([^,]*),([^,]*),([^,]*),([^,]*),(.*)$/); if(!m) return;
      const rec = {id:'i'+Math.random().toString(36).slice(2,10), day:m[1], name:m[2].replace(/^"|"$/g,'').replace(/""/g,'"'), num:m[3], score:+m[4], profit:+m[5], E:+m[6], S:+m[7], G:+m[8], players:+m[9], at:m[10]};
      if(!all.some(r=>r.day===rec.day && r.num===rec.num && r.at===rec.at)){ all.push(rec); added++; }
    });
    writeRows(all); renderAdmin(); render(); adminOpen = true; renderAdmin();
    const n = document.createElement('p'); n.className='note'; n.textContent = `${added}개 기록을 합쳤어요.`; $('#adminBox').prepend(n);
  };
  $('#wipe').onclick = () => { if(confirm('이 기기의 랭킹 기록을 모두 지울까요? 먼저 CSV로 내보내 두세요.')){ writeRows([]); render(); adminOpen=true; renderAdmin(); } };
  box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ writeRows(rows().filter(r=>r.id!==b.dataset.del)); render(); adminOpen=true; renderAdmin(); });
}

// ───────── 장면 (192×108 픽셀) ─────────
const cv = $('#scene'), cx = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const stars = Array.from({length:40},()=>({x:Math.random()*192|0,y:Math.random()*48|0,p:Math.random()*6}));
let puffs = [], tick = 0, sparkle = 0, storm = 0;
function px(x,y,w,h,c){ cx.fillStyle=c; cx.fillRect(x|0,y|0,w|0,h|0); }
function sceneState(){
  const h = sceneHalf();
  const list = curList();
  const st = {};
  AREAS.forEach(a=>{ st[a] = {eff:score(effAt(list,a,h)), pend:score(effAt(list,a,h)+pendAt(list,a,h))}; });
  return st;
}
function drawTree(x,y,grown){
  if(!grown){ px(x+2,y-3,1,3,'#6a4a2a'); px(x+1,y-5,3,2,'#3d7a52'); return; }
  px(x+2,y-5,2,5,'#6a4a2a'); px(x,y-12,6,4,'#2f8a55'); px(x-1,y-9,8,4,'#3fa868'); px(x+1,y-14,4,2,'#5fd38a');
}
function drawPerson(x,y,c,step){
  px(x+1,y-8,3,3,'#f2c9a0'); px(x,y-5,5,4,c); px(x+(step?0:1),y-1,1,1,'#22264a'); px(x+(step?4:3),y-1,1,1,'#22264a');
}
function draw(){
  tick++;
  // sky
  px(0,0,192,30,'#141838'); px(0,30,192,20,'#1b2050'); px(0,50,192,20,'#252b62');
  stars.forEach(s=>{ const on = reduce || ((tick/20+s.p)%6)>1; if(on) px(s.x,s.y,1,1, s.p>4?'#ffe9a8':'#c9cdf0'); });
  px(160,8,9,9,'#f4ead2'); px(163,9,6,7,'#141838'); // moon
  // hills & ground
  px(0,70,192,6,'#1d2a3a'); px(0,76,192,32,'#1f3a2c'); px(0,76,192,2,'#2c5a3e');
  for(let i=0;i<192;i+=12) px(i,90+((i/12)%2),6,1,'#2c5a3e');
  const st = sceneState();
  // HQ tower (G)
  px(140,34,26,44,'#2a2f55'); px(140,34,26,2,'#3b4478');
  const lit = Math.round(st.G.eff*12), pend = Math.round(st.G.pend*12);
  for(let r=0;r<6;r++) for(let c=0;c<2;c++){ const idx=r*2+c; const col = idx<lit?'#ffd166': idx<pend?'#6b5d3a':'#151935'; px(144+c*10,39+r*6,6,3,col); }
  px(151,28,1,6,'#9aa0c4'); px(152,28,5,3, st.G.eff>0.3?'#a98bff':'#4a4570');
  // distillery building
  px(46,48,62,30,'#7a3d2c'); for(let r=0;r<6;r++) for(let c=0;c<12;c++) if((r+c)%3===0) px(47+c*5+(r%2)*2,50+r*5,3,1,'#6a3324');
  px(44,44,66,5,'#4a2a22'); px(70,62,12,16,'#2b1a14'); px(54,55,8,6,'#ffcf7a'); px(92,55,8,6,'#ffcf7a');
  // chimney + smoke
  px(98,26,8,20,'#5a2e22'); px(97,24,10,3,'#3a1e18');
  if(!reduce && tick%14===0) puffs.push({x:101,y:22,r:2,life:0});
  puffs.forEach(p=>{ p.y-=0.35; p.x+=0.18; p.life++; p.r = 2+p.life/40; });
  puffs = puffs.filter(p=>p.life<110);
  const smoke = st.E.eff>0.5 ? '#c9cdf0' : '#8f93ad';
  puffs.forEach(p=>{ cx.globalAlpha = Math.max(0,1-p.life/110)*0.7; px(p.x,p.y,p.r,p.r,smoke); });
  cx.globalAlpha = 1;
  // copper pot still
  px(18,58,22,20,'#c8693a'); px(20,54,18,4,'#d9874f'); px(24,48,10,6,'#d9874f'); px(27,42,4,6,'#b8643a');
  px(31,42,16,2,'#b8643a'); px(22,62,4,10,'#e9a36b');
  // barrels
  [[112,68],[121,68],[116,62]].forEach(([x,y])=>{ px(x,y,8,9,'#7a4a24'); px(x,y+2,8,1,'#3a2410'); px(x,y+6,8,1,'#3a2410'); });
  // sign
  px(58,40,38,8,'#22264a'); px(58,40,38,1,'#f0a83a');
  cx.fillStyle='#f0a83a'; cx.font='6px monospace'; cx.fillText('SAMSONG',62,46);
  // trees (E)
  const trees = Math.round(st.E.pend*6), grownT = Math.round(st.E.eff*6);
  for(let i=0;i<trees;i++) drawTree(4+i*7+(i>2?0:0), 92 - (i%2)*4, i<grownT);
  // people (S)
  const ppl = Math.round(st.S.pend*6), activeP = Math.round(st.S.eff*6);
  const cols = ['#ff8f6b','#5bb4ff','#ffd166','#f4ead2','#5fd38a','#a98bff'];
  for(let i=0;i<ppl;i++){
    const base = 60+i*14; const wander = reduce?0:Math.sin((tick+i*40)/40)*3;
    if(i<activeP) drawPerson(base+wander, 100, cols[i], (tick>>4)%2);
    else { cx.globalAlpha=.45; drawPerson(base, 100, '#7e86b8', 0); cx.globalAlpha=1; }
  }
  // effects
  if(storm>0){ cx.globalAlpha = Math.min(.35, storm/60); px(0,0,192,108,'#ff2b4a'); cx.globalAlpha=1;
    if(!reduce) for(let i=0;i<30;i++){ const x=(Math.random()*192)|0, y=(Math.random()*108)|0; px(x,y,1,3,'#9fb6ff'); }
    storm--; }
  if(sparkle>0){ if(!reduce) for(let i=0;i<14;i++){ px(Math.random()*192,Math.random()*70,1,1,'#ffd166'); px(Math.random()*192,Math.random()*70,2,2,'#fff2c2'); }
    else { cx.globalAlpha=.15; px(0,0,192,108,'#ffd166'); cx.globalAlpha=1; } sparkle--; }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);


render();
})();
</script>
